[package]
name = "blanc"
version = "0.1.11"
description = "Blanc — Notion 风格本地 Markdown 笔记"
# authors 留空：发布到公共 registry 前不绑定个人身份
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# **必须第一个注册**（见 lib.rs 的 run()）。
# 作用：第二次 `open -a Blanc` 不再起一个新进程，而是把参数交给已在跑的那个实例。
# 没有它的话第二个进程会再去 bind 8787 —— 后端只有一个，端口占用后
# 新进程的界面能开、但所有 API 全挂（读写、树、order 全废）。
tauri-plugin-single-instance = "2"
# 系统目录选择器（「添加知识库」用）。纯浏览器跑时用不到这条 —— 前端按
# inTauriShell() 分流，浏览器走手输绝对路径那条老路。
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-window-state = "2.5.0"

# 只有 macOS 用得上：LSSetDefaultRoleHandlerForContentType 要 CFStringRef
# 以及 Dock 右键「最近打开」要 NSDocumentController + NSURL（见 lib.rs 的
# note_recent_document）。三个都已经是 tauri 的传递依赖，版本对得上，
# 这里只是**显式声明**好让本 crate 能直接用 —— objc2 要用 MainThreadMarker，
# objc2-app-kit / objc2-foundation 要各自那几个 feature。
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSDocumentController"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL"] }
